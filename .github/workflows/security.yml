name: Security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Security gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        shell: bash
        run: |
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --log-opts=--all
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Audit NuGet dependencies
        shell: bash
        run: |
          dotnet restore 'src/Promptarium/Promptarium.csproj' -p:EnableWindowsTargeting=true -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904'
          dotnet restore 'tests/Promptarium.SmokeTests/Promptarium.SmokeTests.csproj' -p:EnableWindowsTargeting=true -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904'
          dotnet restore 'tests/Promptarium.Tests/Promptarium.Tests.csproj' -p:EnableWindowsTargeting=true -p:NuGetAudit=true -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1901%3BNU1902%3BNU1903%3BNU1904'
